services:
  music-api:
    build:
      context: /home/dd/server/music-api
    container_name: music-api
    restart: unless-stopped
    env_file:
      - /home/dd/server/music-api/.env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /home/dd/server/music-api/data:/app/data
      # RW required for player sidecar writes and library deletion (PR #3).
      - /mnt/storage_6tb/Music/complete:/music
      # Read-only slskd history/message databases consumed by the Manager API.
      - ${SLSKD_DATA_PATH:-./slskd-data}:/slskd-data:ro
    # Match SQLite data dir ownership (nobody/nogroup on this host).
    user: "65534:65534"
    group_add:
      - "1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - st_net

networks:
  st_net:
    external: true
