name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_KEY: 0123456789abcdef0123456789abcdef
      NAVIDROME_USERNAME: ci
      NAVIDROME_PASSWORD: ci
      LASTFM_API_KEY: ci
      LASTFM_USERNAME: ci
      DATABASE_PATH: /tmp/music-api-ci.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - run: docker build -t music-api-ci .
